<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>神刀戦姫R ―プリンセス・ブレイド―</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;color:#eee}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #app canvas{max-width:100vw;max-height:100vh;width:auto;height:auto}
  /* 左边：剧本列表 */
  #menu{position:fixed;left:4px;top:4px;width:300px;height:96vh;z-index:999;
        background:#111;color:#ddd;font-size:12px;display:none;box-sizing:border-box;
        border:1px solid #444;transition:transform .2s ease}
  #menu.collapsed{transform:translateX(calc(-100% - 6px))}
  #menu h3{margin:4px 6px;font-size:13px}
  #story-list{width:100%;height:calc(100% - 34px);background:#111;color:#ddd;
              border:0;font-size:12px;outline:none}
  #story-list optgroup{color:#f9c;font-weight:bold}
  #story-list option{color:#ddd;padding:2px 4px}
  /* 右边：StateStoryAsViewer 游戏自带的剧本调试 */
  #pager{position:fixed;right:4px;top:4px;width:250px;height:96vh;z-index:999;
         background:#111;color:#ddd;font-size:12px;display:none;
         border:1px solid #444;overflow-y:auto;transition:transform .2s ease}
  #pager.collapsed{transform:translateX(calc(100% + 6px))}
  .handle{position:fixed;top:50%;transform:translateY(-50%);z-index:1001;
          cursor:pointer;background:rgba(20,20,20,.9);color:#ddd;border:1px solid #666;
          padding:10px 4px;font-size:12px;writing-mode:vertical-rl;user-select:none;
          display:none}
  #handle-left{left:0;border-radius:0 6px 6px 0}
  #handle-right{right:0;border-radius:6px 0 0 6px}
  .handle:hover{background:#333}
  #pager .pg-row{padding:4px 6px;border-bottom:1px solid #333;cursor:pointer;
                 line-height:1.4;word-break:break-all;white-space:normal}
  #pager .pg-row:hover{background:#333}
  #pager .pg-row[aria-selected="true"]{background:#446}
  #tip,#diag{display:none;position:fixed;left:4px;z-index:999;
             background:rgba(0,0,0,.85);padding:6px 10px;border-radius:4px;
             max-width:90vw;font-size:12px}
  #tip{top:4px;color:#f99}
  #diag{bottom:4px;color:#fc9;font-size:11px}
  /* Live2D预览 */
  #viewer{position:fixed;inset:0;z-index:1000;background:#000;display:none;
          align-items:center;justify-content:center}
  #viewer img{max-width:100vw;max-height:100vh;object-fit:contain}
  #viewer .close{position:absolute;top:12px;right:16px;z-index:2;cursor:pointer;
                 background:rgba(0,0,0,.7);color:#fff;border:1px solid #888;
                 border-radius:4px;padding:6px 14px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<select id="pager" size="40"></select>
<div id="menu"><select id="story-list" size="40"></select></div>
<div class="handle" id="handle-left">剧本</div>
<div class="handle" id="handle-right">对话</div>
<div id="tip"></div>
<div id="diag"></div>
<div id="viewer"><span class="close" id="viewer-close">✕ 关闭</span><img id="viewer-img"></div>

<script>
var consoleLog = [];
var _origError = console.error;
console.error = function () {
  consoleLog.push([].slice.call(arguments).map(String).join(' ').slice(0, 400));
  _origError.apply(console, arguments);
};
</script>
<script src="https://cdn.jsdmirror.com/npm/jquery@3.3.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdmirror.com/npm/phaser-ce@v2.20.1/build/phaser.min.js"></script>
<script src="https://cdn.jsdmirror.com/npm/@azerion/phaser-spine@3.0.9/build/phaser-spine.min.js"></script>
<script src="https://cdn.jsdmirror.com/npm/howler@2.0.9/dist/howler.core.min.js"></script>
<script src="js/app.min.js"></script>
<script>
/* ---- Fake Server ---- */
(function () {
  var base = {
    boot: { maintenance: false, pre_registration: false, charas: ['AKINA_DEFAULT'], story_event: false },
    server: { date: '2026-11-19 20:00:00', timestamp: 0, error_level: 0, error_page_id: 0 },
    user_data: {}, user: {}, profile: {}, quest: { story: [], group: [], stage: [] },
    shop: { list: [] }, chara: {}, panel: { board: [] }, notice: {},
    event: {}, gacha: {}, mission: {}, present: {}, item: {}, asset: {},
    battle: {}, creation: {}, friend: {}, ranking: {}, home: {}
  };
  UserRequestManager.prototype.request = function (key, params, complete, ctx) {
    var body = {};
    for (var k in base) body[k] = base[k];
    body[key.replace(/^[a-z]+\//, '')] = body[key.replace(/^[a-z]+\//, '')] || {};
    Object.assign(this.data, body);
    var response = {
      head: { user_data: {}, server: { error_level: 0, timestamp: 0, date: '', error_page_id: 0 } },
      body: body
    };
    if (complete) complete.call(ctx || this, response);
    return { cancel: function () {} };
  };
})();

var AUTO_SCRIPT = new URLSearchParams(location.search).get('script');
var tip = document.getElementById('tip');
var diag = document.getElementById('diag');

function showError(title, detail) {
  tip.textContent = title;
  tip.style.display = 'block';
  if (detail) { diag.textContent = detail; diag.style.display = 'block'; }
}
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'IMG') {
    e.target.style.display = 'none';
    return;
  }
  var st = e.error && e.error.stack ? e.error.stack.split('\n').slice(0,3).join(' | ') : '';
  showError('ERR ' + e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno + ' ' + st,
            consoleLog.slice(-3).join(' || '));
}, true);

window.onload = function () {
  URLFilter.RESOURCE_PATH = 'res/';
  URLFilter.SCRIPT_PATH = URLFilter.RESOURCE_PATH + 'script/';
  // 关掉 debug 覆盖层
  ExConnector.platform.isDebug = function () { return false; };
  // 阻止 boot 注入
  StateBoot.prototype.fitClientDisplaySizePc = function () {};
  StateBoot.prototype.setScreenSize = function () {};
  StateBoot.prototype.setFitClientDisplaySizePc = function () {};
  StateTitle.prototype.goLogin = function () {};
  StateStory.prototype.finishStory = function () {
    if (this.finishingStory) return;
    this.finishingStory = true;
    try { this.storyPlayer && this.storyPlayer.stopSe(); } catch (e) {}
    game.state.start('Title');
  };
  var s = document.createElement('script');
  s.src = 'js/main.js';
  s.onload = waitForTitle;
  document.body.appendChild(s);
};

function waitForTitle() {
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    if (window.game && game.state && game.state.current === 'Title' && game.state.states['Story']) {
      clearInterval(iv);
      onReady();
    } else if (tries > 150) {
      clearInterval(iv);
      showError('启动超时 state=' + (window.game && game.state ? game.state.current : '?'),
                consoleLog.slice(-4).join(' || '));
    }
  }, 200);
}

function onReady() {
  // 注册AVG引擎（使用游戏内置 StoryPlayer）
  var sv = new StateStoryAsViewer();
  game.state.add('StoryViewer', sv);
  sv.view = game.ex.view.createContainer(sv, sv.name);
  sv.loading = game.ex.loading;
  loadStoryList();
  if (AUTO_SCRIPT) playScript(AUTO_SCRIPT);
}

function loadStoryList() {
  fetch('story_ids_full.txt').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (t) {
    var ids = t.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    var groups = { main: [], chara: [], event: [], episode: [] };
    ids.forEach(function (id) {
      var g = id.split('/')[0];
      if (g.indexOf('main') === 0) groups.main.push(id);
      else if (g.indexOf('ev') === 0) groups.event.push(id);
      else if (g.indexOf('memory') === 0) groups.episode.push(id);
      else groups.chara.push(id);
    });
    var labels = { main: 'メインストーリー', chara: '姫神ストーリー', event: 'イベントストーリー', episode: '絆の証ストーリー' };
    var sel = document.getElementById('story-list');
    sel.addEventListener('change', function () {
      var v = sel.value;
      if (!v) return;
      if (v.indexOf('@webp:') === 0) showStand(v.slice(6));
      else playScript(v);
    });
    ['main', 'chara', 'event', 'episode'].forEach(function (key) {
      if (!groups[key].length) return;
      var og = document.createElement('optgroup');
      og.label = labels[key] + ' (' + groups[key].length + ')';
      groups[key].forEach(function (id) {
        var o = document.createElement('option');
        o.value = id;
        o.textContent = id;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    return fetch('getCharaGroup.json').then(function (r) {
      if (!r.ok) throw new Error('getCharaGroup HTTP ' + r.status);
      return r.json();
    }).then(function (g) {
      var og = document.createElement('optgroup');
      og.label = '放置イラスト';
      var list = g.body.chara.group.slice().sort(function (a, b) { return a.sys_id - b.sys_id; });
      list.forEach(function (x) {
        var o = document.createElement('option');
        o.value = '@webp:' + x.res_id;
        o.textContent = x.name + '(' + x.full_name + ')';
        og.appendChild(o);
      });
      sel.appendChild(og);
      document.getElementById('menu').style.display = 'block';
      document.getElementById('handle-left').style.display = 'block';
    });
  }).catch(function (e) {
    showError('剧本列表加载失败: ' + e.message);
  });
}

/* ---- Live2D ---- */
function showStand(resId) {
  var img = document.getElementById('viewer-img');
  img.style.display = 'block';
  img.src = URLFilter.RESOURCE_PATH + 'chara/' + resId + '/stand.webp';
  document.getElementById('viewer').style.display = 'flex';
}
function closeStand() {
  var v = document.getElementById('viewer');
  v.style.display = 'none';
  document.getElementById('viewer-img').removeAttribute('src');
}
document.getElementById('viewer-close').addEventListener('click', closeStand);
document.getElementById('viewer').addEventListener('click', function (e) {
  if (e.target.id === 'viewer') closeStand();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeStand();
});

/* ---- 禁用右上角 ADV 菜单 ---- */
(function () {
  StoryMenu.prototype.consumeTap = function () { return false; };
  var origRefresh = StoryMenu.prototype.refresh;
  StoryMenu.prototype.refresh = function () {
    try { origRefresh.call(this); } catch (e) {}
    var hud = this.view && this.view.group ? this.view.group["adv_hud"] : null;
    if (hud) hud.visible = false;
  };
})();

function playScript(id) {
  if (!id) return;
  closeStand();
  game.state.start('StoryViewer', true, false, id);
  var pager = document.getElementById('pager');
  pager.style.display = 'block';
  document.getElementById('handle-right').style.display = 'block';
  setTimeout(function () { upgradePager(pager); }, 100);
}

function upgradePager(pager) {
  var opts = pager.querySelectorAll('option');
  if (!opts.length || pager.querySelector('.pg-row')) return;
  var rows = document.createDocumentFragment();
  opts.forEach(function (o) {
    var d = document.createElement('div');
    d.className = 'pg-row';
    d.setAttribute('data-page', o.getAttribute('value') || '');
    d.textContent = o.textContent;
    d.addEventListener('click', function () {
      var player = currentPlayer();
      if (!player) return;
      player.script.setPage(parseInt(d.getAttribute('data-page'), 10), true);
      player.refreshPage();
      pager.querySelectorAll('.pg-row').forEach(function (x) { x.removeAttribute('aria-selected'); });
      d.setAttribute('aria-selected', 'true');
      d.scrollIntoView({ block: 'nearest' });
    });
    rows.appendChild(d);
  });
  pager.innerHTML = '';
  pager.appendChild(rows);
  var st = game && game.state && game.state.states ? game.state.states['StoryViewer'] : null;
  if (st && st.onPageChange) {
    st.onPageChange.add(function () {
      var player = currentPlayer();
      if (!player) return;
      var cur = player.script.getCurrentPage();
      pager.querySelectorAll('.pg-row').forEach(function (x) {
        x.removeAttribute('aria-selected');
        if (parseInt(x.getAttribute('data-page'), 10) === cur) {
          x.setAttribute('aria-selected', 'true');
          x.scrollIntoView({ block: 'nearest' });
        }
      });
    });
  }
}

/* ---- 按住 Ctrl 快进，松开恢复 ---- */
var modeBeforeSkip = null;
function currentPlayer() {
  var st = game && game.state && game.state.states ? game.state.states['StoryViewer'] : null;
  return st && st.storyPlayer ? st.storyPlayer : null;
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Control') return;
  var p = currentPlayer();
  if (!p || modeBeforeSkip !== null) return;
  modeBeforeSkip = p.getCurrentMode();
  if (modeBeforeSkip !== StoryPlayer.Mode.SKIP) p.changeMode(StoryPlayer.Mode.SKIP);
});
document.addEventListener('keyup', function (e) {
  if (e.key !== 'Control') return;
  var p = currentPlayer();
  if (modeBeforeSkip === null) return;
  if (p && p.getCurrentMode() === StoryPlayer.Mode.SKIP) p.changeMode(modeBeforeSkip);
  modeBeforeSkip = null;
});
window.addEventListener('blur', function () {
  if (modeBeforeSkip === null) return;
  var p = currentPlayer();
  if (p && p.getCurrentMode() === StoryPlayer.Mode.SKIP) p.changeMode(modeBeforeSkip);
  modeBeforeSkip = null;
});

/* ---- 侧栏折叠 / 展开 ---- */
function toggleSide(which) {
  var panel = document.getElementById(which === 'left' ? 'menu' : 'pager');
  var handle = document.getElementById('handle-' + which);
  if (!panel) return;
  var collapsed = panel.classList.toggle('collapsed');
  handle.textContent = collapsed ? (which === 'left' ? '▸ 剧本' : '对话 ◂') : (which === 'left' ? '◂ 剧本' : '对话 ▸');
}
document.getElementById('handle-left').addEventListener('click', function () { toggleSide('left'); });
document.getElementById('handle-right').addEventListener('click', function () { toggleSide('right'); });
</script>
</body>
</html>
